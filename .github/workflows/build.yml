on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node.js 24
      - name: Verify ESB v3 protocol models and tools
        run: |
          python3 -m unittest -v tests/test_esb_v3_protocol.py
          python3 -m py_compile \
            tests/test_esb_v3_protocol.py \
            tools/generate_esb_v3_keys.py \
            tools/analyze_esb_benchmark.py \
            tools/analyze_usbpcap.py
      - name: Compile and execute firmware recovery tests
        env:
          CC: cc
          ESB_REQUIRE_C_COMPILER: "1"
        run: |
          python3 -m unittest -v \
            tests/test_esb_firmware.py \
            tests/test_esb_clock_runtime.py \
            tests/test_esb_ack_runtime.py \
            tests/test_esb_startup_runtime.py \
            tests/test_esb_rx_runtime.py \
            tests/test_auto_base.py \
            tests/test_owned_swapper.py \
            tests/test_prospector_runtime.py

  build:
    uses: ./.github/workflows/build-pinned.yml
