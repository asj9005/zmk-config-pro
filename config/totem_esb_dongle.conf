CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_TOTEM_ESB_PROSPECTOR=y

CONFIG_ZMK_USB=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_SLEEP=n

# Keep display and flush work below radio/USB processing priority.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=10
