# Common low-latency ESB split profile. The existing BLE profile remains unchanged.
CONFIG_TOTEM_ESB_COMPAT=y

CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3

CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=128
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=16
CONFIG_ZMK_SPLIT_ESB_MSGQ_FULL_TIMEOUT_MS=3000

# Upstream hopping is not synchronized between PTX and PRX. Keep it disabled
# until the benchmark confirms a safe synchronized strategy.
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=n
CONFIG_ZMK_SPLIT_ESB_RETRY_INPUT_EVENT=0
CONFIG_ZMK_SPLIT_ESB_RETRY_KEY_POSITION=3
CONFIG_ZMK_SPLIT_ESB_RETRY_SENSOR_EVENT=3
CONFIG_ZMK_SPLIT_ESB_RETRY_BATTERY_EVENT=3
# PRX commands remain queued as ACK payloads; the SDK does not expose a
# per-command completion ID for an additional application retry layer.
CONFIG_ZMK_SPLIT_ESB_RETRY_CMD=0

CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=38

# Boot-session IDs use the nRF52840 hardware entropy source so one half can
# reboot without its sequence stream being mistaken for stale traffic.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_PIPE_COUNT=3
CONFIG_ESB_TX_FIFO_SIZE=4

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16

CONFIG_ZMK_BATTERY_REPORTING=y
