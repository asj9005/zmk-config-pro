CONFIG_TOTEM_ESB_BENCHMARK=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_INF=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1

# Benchmark-only: remove debounce to isolate transport cadence.
CONFIG_TOTEM_ESB_BENCHMARK_ZERO_DEBOUNCE=y
