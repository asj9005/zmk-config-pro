# BLE-parity secure ESB v3 profile. Keep the v2 profile available for the
# mandatory same-hardware latency comparison.
CONFIG_TOTEM_ESB_V3=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=n

CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_128=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CMAC=y
# Oberon's CMAC implementation uses the AES ECB primitive internally.
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y

# The 20-40 byte hot path favors a heapless, mutex-free baseline. CC3XX is an
# A/B benchmark candidate, not an assumed improvement for short packets.
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOT_BUFFER_SIZE=16
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=10
CONFIG_MBEDTLS_ENABLE_HEAP=n
CONFIG_PSA_WANT_GENERATE_RANDOM=n

# MIC4 replaces the v2 CRC32. Dynamic ESB payloads mean this maximum does not
# add airtime to ordinary key frames; it only accommodates the largest command.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
