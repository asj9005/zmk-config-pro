include:
  - board: xiao_ble//zmk
    shield: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left
    artifact-name: totem_left_esb
  - board: xiao_ble//zmk
    shield: totem_right totem_esb_right
    artifact-name: totem_right_esb
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter totem_esb_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: totem_dongle_esb_prospector
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left totem_esb_benchmark
    artifact-name: totem_left_esb_benchmark
  - board: xiao_ble//zmk
    shield: totem_right totem_esb_right totem_esb_benchmark
    artifact-name: totem_right_esb_benchmark
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter totem_esb_dongle totem_esb_benchmark
    artifact-name: totem_dongle_esb_prospector_benchmark
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left totem_esb_v3
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_left_esb_v3_testkey
  - board: xiao_ble//zmk
    shield: totem_right totem_esb_right totem_esb_v3
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_right_esb_v3_testkey
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter totem_esb_dongle totem_esb_v3
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_dongle_esb_v3_prospector_testkey
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left totem_esb_v3 totem_esb_benchmark
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_left_esb_v3_benchmark_testkey
  - board: xiao_ble//zmk
    shield: totem_right totem_esb_right totem_esb_v3 totem_esb_benchmark
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_right_esb_v3_benchmark_testkey
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter totem_esb_dongle totem_esb_v3 totem_esb_benchmark
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y
    artifact-name: ci_only_totem_dongle_esb_v3_prospector_benchmark_testkey
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left totem_esb_v3
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y -DCONFIG_TOTEM_ESB_DIAGNOSTICS=y
    artifact-name: ci_only_totem_left_esb_v3_diagnostic_testkey
  # Controlled startup comparison: identical to the left diagnostic except
  # for the main stack. Keep the original diagnostic available for A/B checks.
  - board: xiao_ble//zmk
    shield: totem_left totem_esb_left totem_esb_v3
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y -DCONFIG_TOTEM_ESB_DIAGNOSTICS=y -DCONFIG_MAIN_STACK_SIZE=4096
    artifact-name: ci_only_totem_left_esb_v3_stackprobe_testkey
  - board: xiao_ble//zmk
    shield: totem_right totem_esb_right totem_esb_v3
    cmake-args: -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y -DCONFIG_TOTEM_ESB_DIAGNOSTICS=y
    artifact-name: ci_only_totem_right_esb_v3_diagnostic_testkey
  - board: xiao_ble//zmk
    shield: totem_dongle prospector_adapter totem_esb_dongle totem_esb_v3
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_TOTEM_ESB_V3_CI_TEST_KEYS=y -DCONFIG_TOTEM_ESB_DIAGNOSTICS=y
    artifact-name: ci_only_totem_dongle_esb_v3_prospector_diagnostic_testkey
